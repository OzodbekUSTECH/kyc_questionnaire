services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 3

  fastapi_app:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - postgres
    ports:
      - "${FASTAPI_PORT}:${FASTAPI_PORT}"
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host=${FASTAPI_HOST} --port=${FASTAPI_PORT} --workers=${FASTAPI_WORKERS}"



volumes:
  postgres_data: