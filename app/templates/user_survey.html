<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survey Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <div x-data="surveyApp()" x-init="init()" class="min-h-screen bg-gray-100">
        <div class="max-w-5xl mx-auto px-4 py-8">
            <!-- Header -->
            <div class="bg-white rounded-lg shadow-sm p-4 sm:p-6 mb-6">
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                    <div class="flex-1">
                        <button @click="goBack()" class="text-sm text-gray-500 hover:text-gray-700 mb-2">← Back</button>
                        <h2 class="text-xl sm:text-2xl font-bold text-gray-900" x-text="survey?.title || 'Loading...'"></h2>
                        <div class="text-gray-500 text-sm mt-1">Survey ID: <code class="bg-gray-100 px-2 py-1 rounded text-xs" x-text="surveyId"></code></div>
                    </div>
                    <div class="flex flex-col sm:items-end gap-2">
                        <div class="text-sm text-gray-600">Step <span x-text="currentStep + 1"></span> of <span x-text="totalSteps"></span></div>
                        <!-- Progress bar -->
                        <div class="w-full sm:w-32 h-2 bg-gray-200 rounded-full overflow-hidden">
                            <div class="h-full bg-black transition-all duration-300" :style="`width: ${((currentStep + 1) / totalSteps) * 100}%`"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Main Content -->
                <!-- Loading State -->
                <div x-show="isLoading" x-cloak class="flex justify-center items-center py-12">
                    <div class="text-center">
                        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600 mx-auto"></div>
                        <p class="mt-4 text-gray-600">Loading survey...</p>
                    </div>
                </div>

                <!-- Error State -->
                <div x-show="error" x-cloak class="bg-red-50 border border-red-200 rounded-md p-4 mb-6">
                    <div class="flex">
                        <div class="ml-3">
                            <h3 class="text-sm font-medium text-red-800">Error</h3>
                            <div class="mt-2 text-sm text-red-700">
                                <p x-text="error"></p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Survey Content -->
                <div x-show="!isLoading && !error && !isSubmitted" x-cloak>
                    <!-- Current Section -->
                    <div x-show="currentSection" class="bg-white rounded-3xl shadow p-6">
                        <h3 class="text-lg font-semibold mb-4" x-text="currentSection.title"></h3>

                        <!-- Standard fields -->
                        <div x-show="currentSection.fields && currentSection.fields.length > 0" class="grid md:grid-cols-2 gap-4">
                            <template x-for="field in currentSection.fields" :key="field.key">
                                <div>
                                    <!-- Text Input -->
                                    <div x-show="field.type === 'text' || field.type === 'email' || field.type === 'number' || field.type === 'date'">
                                        <label class="block mb-4">
                                            <span class="block text-sm text-gray-700 mb-1">
                                                <span x-text="field.label"></span>
                                                <span x-show="field.required"> *</span>
                                            </span>
                                            <input 
                                                :type="field.type" 
                                                x-model="answers[currentSection.id][field.key]"
                                                @input="saveToStorage()"
                                                :required="field.required"
                                                class="w-full border rounded-xl p-3"
                                            />
                                        </label>
                                    </div>

                                    <!-- Textarea -->
                                    <div x-show="field.type === 'textarea'">
                                        <label class="block mb-4">
                                            <span class="block text-sm text-gray-700 mb-1">
                                                <span x-text="field.label"></span>
                                                <span x-show="field.required"> *</span>
                                            </span>
                                            <textarea 
                                                x-model="answers[currentSection.id][field.key]"
                                                @input="saveToStorage()"
                                                :required="field.required"
                                                class="w-full border rounded-xl p-3"
                                            ></textarea>
                                        </label>
                                    </div>

                                    <!-- Select -->
                                    <div x-show="field.type === 'select'">
                                        <label class="block mb-4">
                                            <span class="block text-sm text-gray-700 mb-1">
                                                <span x-text="field.label"></span>
                                                <span x-show="field.required"> *</span>
                                            </span>
                                            <select 
                                                x-model="answers[currentSection.id][field.key]"
                                                @change="saveToStorage()"
                                                :required="field.required"
                                                class="w-full border rounded-xl p-3"
                                            >
                                                <option value="">Select…</option>
                                                <template x-for="option in (field.options || '').split(',').map(o => o.trim()).filter(Boolean)" :key="option">
                                                    <option :value="option" x-text="option"></option>
                                                </template>
                                            </select>
                                        </label>
                                    </div>

                                    <!-- Checkbox -->
                                    <div x-show="field.type === 'checkbox'">
                                        <label class="flex items-start gap-3 mb-4">
                                            <input 
                                                type="checkbox" 
                                                x-model="answers[currentSection.id][field.key]"
                                                @change="saveToStorage()"
                                                :required="field.required"
                                                class="mt-1"
                                            />
                                            <span class="text-sm text-gray-700">
                                                <span x-text="field.label"></span>
                                                <span x-show="field.required"> *</span>
                                            </span>
                                        </label>
                                    </div>

                                    <!-- Tags -->
                                    <div x-show="field.type === 'tags'">
                                        <label class="block mb-4">
                                            <span class="block text-sm text-gray-700 mb-1">
                                                <span x-text="field.label"></span>
                                                <span x-show="field.required"> *</span>
                                            </span>
                                            <input 
                                                type="text" 
                                                x-model="answers[currentSection.id][field.key]"
                                                @input="saveToStorage()"
                                                :required="field.required"
                                                placeholder="Comma‑separated"
                                                class="w-full border rounded-xl p-3"
                                            />
                                        </label>
                                    </div>
                                </div>
                            </template>
                        </div>

                        <!-- Repeaters -->
                        <div x-show="currentSection.repeaters && currentSection.repeaters.length > 0" class="space-y-6">
                            <template x-for="repeater in currentSection.repeaters" :key="repeater.key">
                                <div class="mb-6">
                                    <div class="flex items-center justify-between mb-2">
                                        <h4 class="font-medium" x-text="repeater.label"></h4>
                                        <button 
                                            type="button" 
                                            @click="addRepeaterItem(repeater.key)"
                                            class="px-3 py-1 rounded-lg border"
                                        >
                                            Add <span x-text="repeater.itemLabel"></span>
                                        </button>
                                    </div>
                                    
                                    <template x-for="(item, index) in (answers[currentSection.id][repeater.key] || [])" :key="index">
                                        <div class="grid md:grid-cols-2 gap-3 border rounded-2xl p-4 mb-3">
                                            <template x-for="field in repeater.fields" :key="field.key">
                                                <div>
                                                    <label class="block mb-4">
                                                        <span class="block text-sm text-gray-700 mb-1">
                                                            <span x-text="field.label"></span>
                                                            <span x-show="field.required"> *</span>
                                                        </span>
                                                        <input 
                                                            :type="field.type || 'text'" 
                                                            x-model="answers[currentSection.id][repeater.key][index][field.key]"
                                                            @input="saveToStorage()"
                                                            :required="field.required"
                                                            class="w-full border rounded-xl p-3"
                                                        />
                                                    </label>
                                                </div>
                                            </template>
                                            <div class="flex items-center justify-end">
                                                <button 
                                                    type="button" 
                                                    @click="removeRepeaterItem(repeater.key, index)"
                                                    class="text-sm text-red-600"
                                                >
                                                    Remove
                                                </button>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </template>
                        </div>

                        <!-- File Uploads -->
                        <div x-show="currentSection.uploads && currentSection.uploads.length > 0" class="space-y-6">
                            <template x-for="upload in currentSection.uploads" :key="upload.key">
                                <div class="mb-6">
                                    <div class="text-sm text-gray-700 mb-2">
                                        <span x-text="upload.label"></span>
                                        <span x-show="upload.required"> *</span>
                                    </div>
                                    
                                    <div class="border-2 border-dashed rounded-2xl p-6 text-center"
                                         :class="dragStates[upload.key] ? 'bg-gray-50' : ''"
                                         @dragover.prevent="dragStates[upload.key] = true"
                                         @dragleave="dragStates[upload.key] = false"
                                         @drop.prevent="dragStates[upload.key] = false; handleFileUpload(upload.key, $event)">
                                        <input 
                                            type="file" 
                                            :id="'file-' + upload.key"
                                            @change="handleFileUpload(upload.key, $event)"
                                            multiple
                                            class="hidden"
                                        />
                                        <label 
                                            :for="'file-' + upload.key"
                                            class="inline-block px-4 py-2 rounded-xl border shadow-sm cursor-pointer"
                                        >
                                            Choose files
                                        </label>
                                        <div class="mt-2 text-xs text-gray-500">
                                            Drag & drop files here. PDF/JPG/PNG up to 50MB each.
                                        </div>
                                    </div>

                                    <!-- Uploaded Files -->
                                    <div x-show="uploads[currentSection.id] && uploads[currentSection.id][upload.key] && uploads[currentSection.id][upload.key].length > 0" class="mt-3 flex flex-wrap gap-2">
                                        <template x-for="(file, index) in uploads[currentSection.id][upload.key]" :key="index">
                                            <span class="px-2 py-1 rounded-full text-xs bg-gray-100 border" x-text="file.name"></span>
                                        </template>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>

                    <!-- Navigation -->
                    <div class="mt-6 flex items-center justify-between">
                        <button 
                            @click="previousStep()" 
                            :disabled="currentStep === 0"
                            class="px-4 py-2 rounded-xl border disabled:opacity-50"
                        >
                            Back
                        </button>
                        
                        <div class="flex items-center gap-3">
                            <button 
                                @click="nextStep()" 
                                :disabled="currentStep === totalSteps - 1"
                                x-show="currentStep < totalSteps - 1"
                                class="px-5 py-2 rounded-xl bg-black text-white"
                            >
                                Next
                            </button>
                            
                            <button 
                                @click="submitSurvey()" 
                                :disabled="isSubmitting"
                                x-show="currentStep === totalSteps - 1"
                                class="px-5 py-2 rounded-xl bg-black text-white disabled:opacity-50"
                            >
                                <span x-show="!isSubmitting">Submit</span>
                                <span x-show="isSubmitting">Submitting…</span>
                            </button>
                        </div>
                    </div>

                    <!-- Auto-save indicator -->
                    <div class="mt-4 flex items-center gap-2 text-xs text-gray-500">
                        <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
                        <span>Autosaved locally. You can safely close and come back via the same link.</span>
                    </div>
                </div>

                <!-- Success State -->
                <div x-show="isSubmitted" x-cloak class="bg-white rounded-3xl shadow p-8 text-center">
                    <h3 class="text-xl font-semibold">Thank you!</h3>
                    <p class="text-gray-600 mt-2">Your information has been submitted. Our compliance team will review and contact you if anything else is needed.</p>
                </div>
        </div>
    </div>

    <script>
        function surveyApp() {
            return {
                isLoading: true,
                error: null,
                isSubmitting: false,
                isSubmitted: false,
                survey: null,
                answer: null,
                currentStep: 0,
                answers: {},
                uploads: {},
                dragStates: {},
                answerId: null,
                surveyId: null,

                get totalSteps() {
                    return this.survey?.data?.sections?.length || 0;
                },

                get currentSection() {
                    return this.survey?.data?.sections?.[this.currentStep];
                },

                async init() {
                    try {
                        // Получаем ID опроса из сервера
                        this.surveyId = "{{ survey_id }}";
                        
                        // Загружаем данные опроса через API
                        await this.loadSurvey();
                        
                        // Проверяем, есть ли сохраненный ответ
                        await this.loadAnswer();

                        // Инициализируем структуру ответов
                        this.initializeAnswers();

                        // Загружаем сохраненные данные из storage
                        this.loadFromStorage();

                        this.isLoading = false;
                    } catch (error) {
                        console.error('Error initializing survey:', error);
                        this.error = 'Failed to load survey';
                        this.isLoading = false;
                    }
                },

                async loadSurvey() {
                    const response = await fetch(`/surveys/${this.surveyId}`);
                    if (!response.ok) {
                        throw new Error('Failed to load survey');
                    }
                    this.survey = await response.json();
                },

                async loadAnswer() {
                    // Пока что не загружаем сохраненные ответы
                    // В будущем можно добавить логику поиска по survey_id
                },

                initializeAnswers() {
                    if (!this.survey?.data?.sections) return;

                    this.survey.data.sections.forEach(section => {
                        if (!this.answers[section.id]) {
                            this.answers[section.id] = {};
                        }

                        // Инициализируем поля
                        if (section.fields) {
                            section.fields.forEach(field => {
                                if (this.answers[section.id][field.key] === undefined) {
                                    if (field.type === 'checkbox') {
                                        this.answers[section.id][field.key] = false;
                                    } else if (field.type === 'tags') {
                                        this.answers[section.id][field.key] = [];
                                    } else {
                                        this.answers[section.id][field.key] = '';
                                    }
                                }
                            });
                        }

                        // Инициализируем повторители
                        if (section.repeaters) {
                            section.repeaters.forEach(repeater => {
                                if (!this.answers[section.id][repeater.key]) {
                                    this.answers[section.id][repeater.key] = [];
                                }
                            });
                        }

                        // Инициализируем загрузки
                        if (section.uploads) {
                            if (!this.uploads[section.id]) {
                                this.uploads[section.id] = {};
                            }
                            section.uploads.forEach(upload => {
                                if (!this.uploads[section.id][upload.key]) {
                                    this.uploads[section.id][upload.key] = [];
                                }
                            });
                        }
                    });
                },

                loadFromStorage() {
                    const storageKey = `survey_${this.surveyId}`;
                    
                    // Сначала пробуем localStorage
                    let saved = localStorage.getItem(storageKey);
                    if (!saved) {
                        // Если нет в localStorage, пробуем sessionStorage
                        saved = sessionStorage.getItem(storageKey);
                    }
                    
                    if (saved) {
                        try {
                            const data = JSON.parse(saved);
                            this.answers = { ...this.answers, ...data.answers };
                            this.uploads = { ...this.uploads, ...data.uploads };
                            console.log('Loaded data from storage:', data);
                        } catch (e) {
                            console.error('Error loading from storage:', e);
                        }
                    }
                },

                saveToStorage() {
                    const storageKey = `survey_${this.surveyId}`;
                    const data = {
                        answers: this.answers,
                        uploads: this.uploads,
                        timestamp: Date.now()
                    };
                    
                    try {
                        // Сохраняем в localStorage (основное хранилище)
                        localStorage.setItem(storageKey, JSON.stringify(data));
                        
                        // Также сохраняем в sessionStorage как резерв
                        sessionStorage.setItem(storageKey, JSON.stringify(data));
                        
                        console.log('Data saved to storage');
                    } catch (e) {
                        console.error('Error saving to storage:', e);
                        // Если localStorage не работает, пробуем только sessionStorage
                        try {
                            sessionStorage.setItem(storageKey, JSON.stringify(data));
                        } catch (e2) {
                            console.error('Error saving to sessionStorage:', e2);
                        }
                    }
                },

                goBack() {
                    window.location.href = '/';
                },

                nextStep() {
                    if (this.currentStep < this.totalSteps - 1) {
                        this.currentStep++;
                        this.saveToStorage();
                    }
                },

                previousStep() {
                    if (this.currentStep > 0) {
                        this.currentStep--;
                    }
                },

                addRepeaterItem(repeaterKey) {
                    if (!this.answers[this.currentSection.id][repeaterKey]) {
                        this.answers[this.currentSection.id][repeaterKey] = [];
                    }
                    this.answers[this.currentSection.id][repeaterKey].push({});
                    this.saveToStorage();
                },

                removeRepeaterItem(repeaterKey, index) {
                    this.answers[this.currentSection.id][repeaterKey].splice(index, 1);
                    this.saveToStorage();
                },

                async handleFileUpload(uploadKey, event) {
                    const files = Array.from(event.target.files || event.dataTransfer.files);
                    if (!files.length) return;

                    for (const file of files) {
                        // Проверка размера файла
                        if (file.size > 50 * 1024 * 1024) {
                            alert(`${file.name}: exceeds 50MB`);
                            continue;
                        }

                        // Проверка типа файла
                        if (!/(pdf|jpg|jpeg|png)$/i.test(file.name.split(".").pop() || "")) {
                            alert(`${file.name}: unsupported type`);
                            continue;
                        }

                        try {
                            const formData = new FormData();
                            formData.append('file', file);

                            const response = await fetch('/files/upload', {
                                method: 'POST',
                                body: formData
                            });

                            if (response.ok) {
                                const result = await response.json();
                                
                                if (!this.uploads[this.currentSection.id]) {
                                    this.uploads[this.currentSection.id] = {};
                                }
                                if (!this.uploads[this.currentSection.id][uploadKey]) {
                                    this.uploads[this.currentSection.id][uploadKey] = [];
                                }
                                
                                this.uploads[this.currentSection.id][uploadKey].push({
                                    name: file.name,
                                    size: file.size,
                                    type: file.type,
                                    url: result.file_url,
                                    path: result.file_path
                                });
                                
                                this.saveToStorage();
                            } else {
                                alert('Failed to upload file: ' + file.name);
                            }
                        } catch (error) {
                            alert('Failed to upload file: ' + file.name);
                        }
                    }

                    if (event.target) {
                        event.target.value = '';
                    }
                },

                removeFile(uploadKey, index) {
                    this.uploads[this.currentSection.id][uploadKey].splice(index, 1);
                    this.saveToStorage();
                },

                clearStorage() {
                    const storageKey = `survey_${this.surveyId}`;
                    try {
                        localStorage.removeItem(storageKey);
                        sessionStorage.removeItem(storageKey);
                        console.log('Storage cleared after successful submission');
                    } catch (e) {
                        console.error('Error clearing storage:', e);
                    }
                },

                async submitSurvey() {
                    this.isSubmitting = true;
                    try {
                        const data = {
                            survey_id: this.survey.id,
                            data: this.answers,
                            uploads: this.uploads,
                            status: 'COMPLETED'
                        };

                        const url = this.answerId ? `/answers/${this.answerId}` : '/answers/';
                        const method = this.answerId ? 'PATCH' : 'POST';

                        const response = await fetch(url, {
                            method: method,
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify(data)
                        });

                        if (response.ok) {
                            this.isSubmitted = true;
                            // Очищаем storage после успешной отправки
                            this.clearStorage();
                        } else {
                            const errorText = await response.text();
                            alert('Failed to submit survey: ' + errorText);
                        }
                    } catch (error) {
                        alert('Failed to submit survey: ' + error.message);
                    } finally {
                        this.isSubmitting = false;
                    }
                }
            }
        }
    </script>
</body>
</html>
