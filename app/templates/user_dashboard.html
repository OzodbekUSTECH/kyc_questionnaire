<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survey Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <div x-data="surveyApp()" x-init="init()" class="min-h-screen">
        <!-- Header -->
        <nav class="bg-white shadow">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between h-16">
                    <div class="flex items-center">
                        <h1 class="text-xl font-semibold text-gray-900">Survey Portal</h1>
                    </div>
                    <div class="flex items-center space-x-4">
                        <a href="/admin/" class="text-gray-500 hover:text-gray-700">Admin Panel</a>
                    </div>
                </div>
            </div>
        </nav>

        <!-- Main Content -->
        <div class="min-h-screen bg-gradient-to-b from-gray-50 to-white">
            <div class="max-w-4xl mx-auto px-4 py-12">
                <!-- Loading State -->
                <div x-show="isLoading" x-cloak class="flex justify-center items-center py-12">
                    <div class="text-center">
                        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600 mx-auto"></div>
                        <p class="mt-4 text-gray-600">Loading surveys...</p>
                    </div>
                </div>

                <!-- Error State -->
                <div x-show="error" x-cloak class="bg-red-50 border border-red-200 rounded-md p-4 mb-6">
                    <div class="flex">
                        <div class="ml-3">
                            <h3 class="text-sm font-medium text-red-800">Error</h3>
                            <div class="mt-2 text-sm text-red-700">
                                <p x-text="error"></p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Surveys List -->
                <div x-show="!isLoading && !error" x-cloak>
                    <div class="text-center mb-8">
                        <h1 class="text-2xl md:text-3xl font-bold">Survey Portal</h1>
                        <p class="text-gray-600 mt-2">Choose a survey to complete. You can pause and resume anytime using your unique link.</p>
                    </div>
                    
                    <div class="grid md:grid-cols-2 gap-6">
                        <template x-for="survey in surveys" :key="survey.id">
                            <button @click="startSurvey(survey.id)" 
                                    :disabled="!survey.is_active"
                                    class="p-6 rounded-3xl border shadow-sm hover:shadow-md text-left disabled:opacity-50 disabled:cursor-not-allowed">
                                <div class="text-sm uppercase tracking-wide text-gray-500 mb-2">
                                    <span x-show="survey.is_active">Active Survey</span>
                                    <span x-show="!survey.is_active">Inactive Survey</span>
                                </div>
                                <div class="text-xl font-semibold mb-2" x-text="survey.title"></div>
                                <p class="text-gray-600" x-text="survey.description || 'No description available'"></p>
                                <div class="mt-4 text-xs text-gray-500">
                                    Created: <span x-text="new Date(survey.created_at).toLocaleDateString()"></span>
                                </div>
                            </button>
                        </template>
                    </div>

                    <!-- Empty State -->
                    <div x-show="surveys.length === 0" x-cloak class="text-center py-12">
                        <div class="text-gray-500">
                            <svg class="mx-auto h-12 w-12 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                            </svg>
                            <h3 class="mt-2 text-sm font-medium text-gray-900">No surveys available</h3>
                            <p class="mt-1 text-sm text-gray-500">There are no active surveys at the moment.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function surveyApp() {
            return {
                isLoading: true,
                error: null,
                surveys: [],

                async init() {
                    await this.loadSurveys();
                },

                async loadSurveys() {
                    try {
                        this.isLoading = true;
                        const response = await fetch('/surveys/?page=1&size=100&is_active=true');
                        
                        if (!response.ok) {
                            throw new Error('Failed to load surveys');
                        }
                        
                        const data = await response.json();
                        this.surveys = data.items || [];
                    } catch (error) {
                        console.error('Error loading surveys:', error);
                        this.error = 'Failed to load surveys. Please try again.';
                    } finally {
                        this.isLoading = false;
                    }
                },

                startSurvey(surveyId) {
                    window.location.href = `/survey/${surveyId}`;
                }
            }
        }
    </script>
</body>
</html>
